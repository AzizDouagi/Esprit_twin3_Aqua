name: CD
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.names.outputs.app_image }}
      web_image: ${{ steps.names.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "base=$image" >> "$GITHUB_OUTPUT"
          echo "app_image=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "web_image=$image-web:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: appmeta
        with:
          images: ${{ steps.names.outputs.base }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/metadata-action@v5
        id: webmeta
        with:
          images: ${{ steps.names.outputs.base }}-web
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.appmeta.outputs.tags }}
          labels: ${{ steps.appmeta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.webmeta.outputs.tags }}
          labels: ${{ steps.webmeta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
  staging:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app_image: ${{ needs.publish.outputs.app_image }}
      web_image: ${{ needs.publish.outputs.web_image }}
    secrets: inherit
  production:
    needs: [publish, staging]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app_image: ${{ needs.publish.outputs.app_image }}
      web_image: ${{ needs.publish.outputs.web_image }}
    secrets: inherit
